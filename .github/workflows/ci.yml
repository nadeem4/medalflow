name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: core

env:
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      # Blocking as of Phase 2. `src` and `tests` are clean under the full ruff
      # config and under black, so any new violation fails the build. The former
      # narrow `--select E9,F821,F822,F823,F811` gate is gone: the full
      # `ruff check` below is blocking and strictly stronger.
      - name: ruff
        run: poetry run ruff check src tests

      - name: black --check
        run: poetry run black --check src tests

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      # pyodbc is declared `optional = true` in pyproject but imported
      # unconditionally at src/medalflow/compute/engines/base.py:11, and no extra
      # exposes it — so `poetry install` never brings it in. Without it every
      # import fails on "No module named 'pyodbc'", masking the real Phase 1
      # breakage. Phase 3 moves pyodbc behind the `[azure]` extra and this goes.
      - name: Install pyodbc (declared optional, imported unconditionally)
        run: |
          # Prefer a wheel. Only fall back to a source build — which needs ODBC
          # headers — when pip cannot find one for this interpreter. The runner
          # ships a packages.microsoft.com apt repo that intermittently returns
          # 403 and fails `apt-get update`, so it is dropped before updating.
          if ! poetry run pip install pyodbc; then
            sudo rm -f /etc/apt/sources.list.d/microsoft*.list                        /etc/apt/sources.list.d/azure*.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq unixodbc-dev
            poetry run pip install pyodbc
          fi

      # Blocking as of Phase 1: the orphaned processor/validator stubs are gone,
      # so the package imports and the suite runs.
      - name: pytest
        run: poetry run pytest

  import-smoke:
    name: import-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Install pyodbc (declared optional, imported unconditionally)
        run: |
          # Prefer a wheel. Only fall back to a source build — which needs ODBC
          # headers — when pip cannot find one for this interpreter. The runner
          # ships a packages.microsoft.com apt repo that intermittently returns
          # 403 and fails `apt-get update`, so it is dropped before updating.
          if ! poetry run pip install pyodbc; then
            sudo rm -f /etc/apt/sources.list.d/microsoft*.list                        /etc/apt/sources.list.d/azure*.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq unixodbc-dev
            poetry run pip install pyodbc
          fi

      # Blocking as of Phase 1. Renamed to `medalflow` in Phase 2.
      - name: Import smoke test
        run: PYTHONPATH=src poetry run python -c "import medalflow; import medalflow.medallion; import medalflow.api"
