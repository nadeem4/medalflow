name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: core

env:
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      # Blocking gate. These rules catch real breakage (syntax errors, undefined
      # or redefined names) and pass on the codebase as it stands today, so any
      # new violation fails the build immediately.
      - name: ruff (errors — blocking)
        run: poetry run ruff check src --select E9,F821,F822,F823,F811

      # Advisory until Phase 2. The full ruff config reports ~771 findings and
      # black would reformat 136 of 140 files. Autofixing them now would mean
      # large Python rewrites (e.g. UP006 `Dict` -> `dict`, unsafe on the 3.9
      # runtime target) which Phase 0 explicitly forbids. Phase 2 cleans these
      # up and flips both steps to blocking by deleting `continue-on-error`.
      - name: ruff (full config — advisory until Phase 2)
        id: ruff_full
        continue-on-error: true
        run: poetry run ruff check src

      - name: black --check (advisory until Phase 2)
        id: black_check
        continue-on-error: true
        run: poetry run black --check src tests

      - name: Report advisory lint status
        run: |
          if [ "${{ steps.ruff_full.outcome }}" = "failure" ] || [ "${{ steps.black_check.outcome }}" = "failure" ]; then
            echo "::warning title=EXPECTED FAILURE UNTIL PHASE 2::Full ruff/black are not clean yet. Phase 2 (Delete & Simplify) fixes this and makes these steps blocking."
            {
              echo "### ⚠️ EXPECTED FAILURE UNTIL PHASE 2"
              echo "\`ruff check src\`: ${{ steps.ruff_full.outcome }} · \`black --check\`: ${{ steps.black_check.outcome }}"
              echo "Blocking error-level ruff gate passed. Phase 2 removes \`continue-on-error\` from both steps."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Advisory lint is clean::Remove continue-on-error from the ruff/black steps to make them blocking."
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      # pyodbc is declared `optional = true` in pyproject but imported
      # unconditionally at src/core/compute/engines/base.py:11, and no extra
      # exposes it — so `poetry install` never brings it in. Without it every
      # import fails on "No module named 'pyodbc'", masking the real Phase 1
      # breakage. Phase 3 moves pyodbc behind the `[azure]` extra and this goes.
      - name: Install pyodbc (declared optional, imported unconditionally)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc-dev
          poetry run pip install pyodbc

      # Advisory until Phase 1. The single existing test transitively imports
      # `core/__init__.py`, which fails on the same missing
      # `core.medallion.base.processor` module as the import smoke test below.
      - name: pytest (advisory until Phase 1)
        id: pytest
        continue-on-error: true
        run: poetry run pytest

      - name: Report test status
        run: |
          if [ "${{ steps.pytest.outcome }}" = "failure" ]; then
            echo "::warning title=EXPECTED FAILURE UNTIL PHASE 1::pytest fails because core/__init__.py imports the deleted core.medallion.base.processor module."
            {
              echo "### ⛔ EXPECTED FAILURE UNTIL PHASE 1 (Python ${{ matrix.python-version }})"
              echo "The only test imports \`core.logging.filters\`, which imports \`core.__version__\` and so pulls in the broken package root."
              echo "Phase 1 removes \`continue-on-error\` from this step."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=pytest is green::Remove continue-on-error from the pytest step to make it blocking."
          fi

  import-smoke:
    name: import-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # --no-root: `poetry install` cannot install the project itself because
      # core/pyproject.toml declares `readme = "README.md"` while README.md lives at
      # the repo root. Source is reached via `pythonpath = ["src"]` (pytest) and
      # PYTHONPATH=src (smoke test) instead. Phase 6 fixes the packaging metadata.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Install pyodbc (declared optional, imported unconditionally)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc-dev
          poetry run pip install pyodbc

      # Phase 1 makes this blocking; Phase 2 renames the imports to `medalflow`.
      - name: Import smoke test
        id: smoke
        continue-on-error: true
        run: PYTHONPATH=src poetry run python -c "import core; import core.medallion; import core.api"

      - name: Report import smoke result
        run: |
          if [ "${{ steps.smoke.outcome }}" = "failure" ]; then
            echo "::warning title=EXPECTED FAILURE UNTIL PHASE 1::import core.medallion fails — 8 processor/validator stubs import the deleted core.medallion.base.processor / base.validator modules."
            {
              echo "### ⛔ EXPECTED FAILURE UNTIL PHASE 1"
              echo "\`import core.medallion\` raises \`ModuleNotFoundError: No module named 'core.medallion.base.processor'\`."
              echo "This job is intentionally non-blocking so CI stays honest about the breakage."
              echo "Phase 1 removes \`continue-on-error\`; Phase 2 renames the imports to \`medalflow\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Import smoke PASSED::Remove continue-on-error from this step to make it blocking."
          fi
