[tool.poetry]
name = "medalflow"
version = "0.1.0.dev0"
description = "Declare medallion (Bronze/Silver/Gold) data models as Python classes; MedalFlow extracts dependencies from your SQL and compiles them into a staged execution plan."
authors = ["nadeem4.nk13@gmail.com"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/nadeem4/medalflow.git"
repository = "https://github.com/nadeem4/medalflow.git"
keywords = ["etl", "elt", "medallion-architecture", "data-engineering", "dag", "sql", "synapse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
packages = [{include = "medalflow", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.0"
opentelemetry-api = "^1.22.0"
sqlglot = "^23.0.0"

# --- The `azure` extra --------------------------------------------------
# Everything below is reachable only through the compute and storage seams
# (medalflow.compute.engines.base, medalflow.datalake.client). Core planning --
# medallion, DAG building, SQL dependency analysis -- never touches it, so a
# bare `pip install medalflow` leaves it out and the `bare-install` CI job
# keeps it that way. Every import site is function-local and guarded by
# medalflow.common.optional_deps.require_module, which names this extra.
#
# pandas is here for the same reason as the SDKs: its only callers are
# DatalakeClient's read/upload paths (over `abfs://`, hence adlfs and pyarrow)
# and BaseSQLEngine.fetch_dataframe (which needs pyodbc anyway).
pandas = {version = "^2.0.0", optional = true}
azure-identity = {version = "^1.15.0", optional = true}
azure-keyvault-secrets = {version = "^4.7.0", optional = true}
azure-storage-file-datalake = {version = "^12.14.0", optional = true}
adlfs = {version = ">=2023.10.0", optional = true}
pyarrow = {version = ">=14.0.0", optional = true}
pyodbc = {version = "^5.0.0", optional = true}

# Without this section `optional = true` makes a dependency uninstallable by
# any means: pyodbc was declared optional with no extra to expose it, so CI
# hand-installed it with a literal `pip install pyodbc`.
[tool.poetry.extras]
azure = [
    "pandas",
    "azure-identity",
    "azure-keyvault-secrets",
    "azure-storage-file-datalake",
    "adlfs",
    "pyarrow",
    "pyodbc",
]

[tool.poetry.group.dev.dependencies]
# Essential testing tools
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
# Code quality essentials. The floors are set by `target-version` above,
# not by taste: `py313` is an unknown value to anything older, and both
# tools fail to start rather than ignore it. black learned it in 24.4.1,
# ruff in 0.4.5.
black = "^24.4.1"
ruff = "^0.4.5"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py313"

# `select`/`ignore` belong under `lint` as of the ruff bump above; left at the
# top level they still work but warn on every run.
[tool.ruff.lint]
# Simplified to essential rules only
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # Line too long - handled by black
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
# "." so shared helpers in tests/conftest.py are importable regardless of how
# pytest is invoked: `python -m pytest` puts CWD on sys.path, the `pytest`
# console script (what CI runs) does not.
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/medalflow"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
